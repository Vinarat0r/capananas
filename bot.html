<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хакерский Navbar с ИИ (Программирование)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #00ff00;
        }
        .navbar {
            background-color: #1a1a1a;
        }
        .navbar-nav .nav-link {
            color: #00ff00;
        }
        .navbar-nav .nav-link:hover {
            color: #fff;
        }
        .navbar-brand {
             color: #00ff00 !important;
        }

        .text-center {
            text-align: center;
        }

        #ai-section {
            margin-top: 40px;
            padding-top: 20px;
        }

        #ai-input {
            background-color: #1a1a1a;
            color: #00ff00;
            border: 1px solid #00ff00;
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            font-family: inherit;
        }
        #ai-input::placeholder {
             color: #008000;
        }
        #ai-input:focus {
            background-color: #000;
            border-color: #fff;
            box-shadow: 0 0 8px #00ff00;
            outline: none;
        }

        #ai-submit {
            background-color: #1a1a1a;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        #ai-submit:hover {
            background-color: #00ff00;
            color: #000;
            box-shadow: 0 0 10px #00ff00;
        }
         #ai-submit:disabled {
            border-color: #555;
            color: #555;
            cursor: not-allowed;
         }
         #ai-submit:disabled:hover {
             background-color: #1a1a1a;
             box-shadow: none;
         }

        #ai-response-area {
            margin-top: 20px;
            border: 1px solid #00ff00;
            padding: 15px;
            background-color: #111;
            min-height: 100px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 0.9em;
        }
        #ai-response-area .loading {
            color: #ffff00;
        }
         #ai-response-area .error {
            color: #ff0000;
         }
    </style>
</head>
<body>

<header>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">TheGreatestProgrammers</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                     <li class="nav-item">
                        <a class="nav-link" href="index.html">О нас</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="prog.html">Великие программисты</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="prog2.html">Программирование</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="bot.html">боты и т.д.</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="abc.html">Создатели сайта</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<div class="container mt-5">

    <div id="ai-section">
        <h2 class="text-center">Спроси ИИ о Программировании</h2>
        <div class="mb-3">
            <label for="ai-input" class="form-label">Ваш вопрос:</label>
            <textarea id="ai-input" rows="3" placeholder="Введите ваш запрос о программировании..."></textarea>
        </div>
        <div class="text-center">
             <button id="ai-submit">Отправить запрос</button>
        </div>
        <div id="ai-response-area" aria-live="polite">
            Здесь появится ответ от ИИ...
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_KEY = "AIzaSyDKp8qMp9SXcFpkU2PJDCefjCZN_YjqASI";
    const MODEL_NAME = "gemma-3-27b-it";
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`;

    const aiInput = document.getElementById('ai-input');
    const aiSubmitBtn = document.getElementById('ai-submit');
    const aiResponseArea = document.getElementById('ai-response-area');

    async function getAiResponse(userPrompt) {
        aiSubmitBtn.disabled = true;
        aiResponseArea.innerHTML = '<span class="loading">Загрузка ответа...</span>';

        const fullPrompt = `Ты — ИИ-ассистент на веб-сайте, посвященном программированию. Твоя задача — отвечать на вопросы пользователей, фокусируясь на темах, связанных с программированием: языки (Python, Java, C++, JavaScript и т.д.), алгоритмы, структуры данных, веб-разработка, базы данных, инструменты разработчика, история программирования, известные личности в IT. Постарайся давать точные и полезные ответы в этом контексте. Если вопрос совершенно не связан с программированием, вежливо укажи на это и предложи задать вопрос по теме сайта Вот вопрос пользователя: "${userPrompt}"`;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    "contents": [{
                        "parts": [{
                            "text": fullPrompt
                        }]
                    }]
                })
            });

            if (!response.ok) {
                let errorData;
                try {
                  errorData = await response.json();
                } catch (e) {
                  errorData = { error: { message: `HTTP ошибка: ${response.status} ${response.statusText}` } };
                }
                console.error('Ошибка API:', errorData);
                if (response.status === 400 && errorData.error?.message.includes('API key not valid')) {
                     throw new Error('API ключ недействителен. Пожалуйста, проверьте ключ.');
                } else if (response.status === 404 && errorData.error?.message.includes('not found')) {
                    throw new Error(`Модель ${MODEL_NAME} не найдена или недоступна через этот API.`);
                }
                throw new Error(errorData.error?.message || `Ошибка сети: ${response.status}`);
            }

            const data = await response.json();

            let responseText = "Не удалось получить ответ.";
            if (data.candidates && data.candidates.length > 0 &&
                data.candidates[0].content && data.candidates[0].content.parts &&
                data.candidates[0].content.parts.length > 0) {
                responseText = data.candidates[0].content.parts[0].text;
            } else if (data.promptFeedback && data.promptFeedback.blockReason) {
                 responseText = `<span class="error">Запрос заблокирован по причине безопасности: ${data.promptFeedback.blockReason}. Попробуйте переформулировать.</span>`;
                 if (data.promptFeedback.safetyRatings) {
                    console.warn('Детали блокировки:', data.promptFeedback.safetyRatings);
                 }
            } else {
                 console.warn("Неожиданная структура ответа:", data);
                 responseText = `<span class="error">Получен неожиданный или пустой ответ от API.</span>`;
            }

            aiResponseArea.textContent = responseText;

        } catch (error) {
            console.error('Ошибка при вызове API:', error);
            aiResponseArea.innerHTML = `<span class="error">Ошибка: ${error.message}</span>`;
        } finally {
            aiSubmitBtn.disabled = false;
        }
    }

    aiSubmitBtn.addEventListener('click', () => {
        const userPrompt = aiInput.value.trim();
        if (userPrompt) {
            getAiResponse(userPrompt);
        } else {
            aiResponseArea.textContent = 'Пожалуйста, введите ваш вопрос о программировании.';
        }
    });

     aiInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            aiSubmitBtn.click();
        }
     });

</script>

</body>
</html>
